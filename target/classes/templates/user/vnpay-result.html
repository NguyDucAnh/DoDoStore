<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kết quả VNPay | DoDo Store</title></head>
<body style="font-family:Arial;background:#f5f5f5;color:#171717"><main style="max-width:620px;margin:70px auto;padding:32px;background:white">
<h1>Kết quả thanh toán</h1><p th:text="${message}"></p>
<section th:if="${orderId != null}"><p>Mã đơn: <span th:text="${orderId}"></span></p>
<p>Số tiền: <span th:text="${#numbers.formatInteger(amount,1,'COMMA')} + ' VND'"></span></p>
<p>Phương thức: VNPay Sandbox</p><p>Trạng thái: <span th:text="${status}"></span></p>
<p>Mã giao dịch: <span th:text="${txnRef}"></span></p></section>
<button onclick="location.reload()">Kiểm tra lại trạng thái</button><p><a th:href="@{/user/history}">Lịch sử đơn hàng</a> · <a th:href="@{/home}">Trang chủ</a></p>
</main></body></html>
