<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả VNPay | DoDo Store</title>

    <link rel="stylesheet"
          th:href="@{/css/web/torano-theme.css}"
          href="/css/web/torano-theme.css">

    <style>
        .result-page {
            margin: 0;
            min-height: 100vh;
            background: #f5f5f3;
            color: #171717;
            font-family: Arial, sans-serif;
        }

        .result-page * {
            box-sizing: border-box;
        }

        .result-wrapper {
            width: min(100% - 32px, 560px);
            margin: 0 auto;
            padding: 48px 0;
        }

        .result-brand {
            margin-bottom: 28px;
            text-align: center;
        }

        .result-brand a {
            color: #171717;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 5px;
            text-decoration: none;
        }

        .result-brand p {
            margin: 10px 0 0;
            color: #777;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .result-card {
            padding: 36px;
            border: 1px solid #e8e8e5;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.05);
        }

        .result-heading {
            text-align: center;
        }

        .result-icon {
            display: grid;
            place-items: center;
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border: 1px solid #e5e5e5;
            border-radius: 50%;
            background: #f7f7f5;
        }

        .result-heading h1 {
            margin: 0 0 12px;
            font-size: clamp(24px, 5vw, 30px);
            line-height: 1.3;
            letter-spacing: -0.8px;
        }

        .result-message {
            margin: 0;
            color: #666;
            font-size: 14px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .result-details {
            margin-top: 28px;
            padding: 20px;
            border: 1px solid #e8e8e5;
            border-radius: 12px;
            background: #fafaf9;
        }

        .result-details h2 {
            margin: 0 0 18px;
            color: #777;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .result-details dl {
            margin: 0;
        }

        .result-row {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr);
            align-items: baseline;
            gap: 16px;
            padding: 13px 0;
            border-bottom: 1px solid #e9e9e6;
            font-size: 13px;
            line-height: 1.6;
        }

        .result-row:first-child {
            padding-top: 0;
        }

        .result-row:last-child {
            padding-bottom: 0;
            border-bottom: 0;
        }

        .result-row dt {
            color: #777;
        }

        .result-row dd {
            margin: 0;
            font-weight: 600;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .result-amount {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .result-status {
            display: inline-block;
            padding: 4px 10px;
            border: 1px solid #dededb;
            border-radius: 6px;
            background: #fff;
            font-size: 12px;
        }

        .result-reference {
            font-family: Consolas, monospace;
            font-size: 12px;
        }

        .result-actions {
            display: grid;
            gap: 12px;
            margin-top: 28px;
        }

        .result-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            min-height: 50px;
            padding: 14px 18px;
            border: 1px solid #171717;
            border-radius: 9px;
            background: #171717;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .result-button:hover {
            background: #333;
            color: #fff;
        }

        .result-button-secondary {
            border-color: #dedede;
            background: #fff;
            color: #333;
        }

        .result-button-secondary:hover {
            background: #f5f5f3;
            color: #171717;
        }

        .result-home {
            display: table;
            margin: 22px auto 0;
            color: #777;
            font-size: 13px;
            text-decoration: none;
        }

        .result-home:hover {
            color: #171717;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .result-page a:focus-visible,
        .result-page button:focus-visible {
            outline: 3px solid #888;
            outline-offset: 4px;
        }

        .result-footer {
            margin: 24px 0 0;
            color: #888;
            font-size: 12px;
            line-height: 1.7;
            text-align: center;
        }

        @media (max-width: 480px) {
            .result-wrapper {
                padding: 30px 0;
            }

            .result-card {
                padding: 28px 20px;
                border-radius: 16px;
            }

            .result-details {
                padding: 16px;
            }

            .result-row {
                grid-template-columns: 90px minmax(0, 1fr);
                gap: 10px;
            }

            .result-amount {
                font-size: 18px;
            }
        }
    </style>
</head>

<body class="result-page">
<main class="result-wrapper">
    <header class="result-brand">
        <a th:href="@{/home}">DODO STORE</a>
        <p>Thông tin thanh toán</p>
    </header>

    <section class="result-card" aria-labelledby="result-title">
        <div class="result-heading">
            <div class="result-icon" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="1.5" stroke-linecap="round"
                     stroke-linejoin="round">
                    <rect x="5" y="3" width="14" height="18" rx="2"/>
                    <path d="M9 8h6M9 12h6M9 16h3"/>
                </svg>
            </div>

            <h1 id="result-title">Kết quả thanh toán</h1>

            <p class="result-message"
               th:text="${message != null ? message : 'Chưa có thông tin kết quả thanh toán.'}">
                Thông tin kết quả thanh toán.
            </p>
        </div>

        <section class="result-details" th:if="${orderId != null}">
            <h2>Chi tiết giao dịch</h2>

            <dl>
                <div class="result-row">
                    <dt>Mã đơn hàng</dt>
                    <dd th:text="${orderId}"></dd>
                </div>

                <div class="result-row">
                    <dt>Số tiền</dt>
                    <dd class="result-amount"
                        th:text="${amount != null
                            ? #numbers.formatInteger(amount, 1, 'COMMA') + ' VND'
                            : '—'}">
                    </dd>
                </div>

                <div class="result-row">
                    <dt>Phương thức</dt>
                    <dd>VNPay Sandbox</dd>
                </div>

                <div class="result-row">
                    <dt>Trạng thái đơn</dt>
                    <dd>
                        <span class="result-status"
                              th:text="${status != null ? status : 'Chưa xác định'}">
                        </span>
                    </dd>
                </div>

                <div class="result-row">
                    <dt>Mã giao dịch</dt>
                    <dd class="result-reference"
                        th:text="${txnRef != null ? txnRef : '—'}">
                    </dd>
                </div>
            </dl>
        </section>

        <div class="result-actions">
            <a class="result-button" th:href="@{/user/history}">
                Xem lịch sử đơn hàng
                <span aria-hidden="true">→</span>
            </a>

            <button type="button"
                    class="result-button result-button-secondary"
                    onclick="window.location.reload()">
                <svg width="17" height="17" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="1.7" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 7v5h-5"/>
                    <path d="M20 12a8 8 0 1 0-2.3 5.7"/>
                </svg>
                Kiểm tra lại trạng thái
            </button>
        </div>

        <a class="result-home" th:href="@{/home}">
            <span aria-hidden="true">←</span> Quay lại trang chủ
        </a>
    </section>

    <p class="result-footer">
        VNPay Sandbox · Môi trường thanh toán thử nghiệm
    </p>
</main>
</body>
</html>
